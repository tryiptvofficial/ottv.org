<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 320 200" fill="none">
  <title>A tablet with a form for adding a playlist link, and a phone playing a channel</title>
  <!-- Original OTTV illustration for the iPhone and iPad guide: generic devices with no manufacturer marks. Ink #0b0b0a, green #25f07c. -->
  <rect width="320" height="200" fill="#ece9e2"/>
  <ellipse cx="160" cy="179" rx="116" ry="6" fill="#0b0b0a" fill-opacity="0.08"/>
  <!-- The top-left corner stays empty for the category tag that cards place there. -->
  <g transform="translate(12.8 14.4) scale(0.92)">

  <!-- Tablet: the player app's form, with the playlist name, the playlist link and the add button -->
  <rect x="48" y="30" width="180" height="128" rx="12" fill="#ffffff" stroke="#0b0b0a" stroke-width="2"/>
  <rect x="58" y="40" width="160" height="108" rx="5" fill="#0b0b0a"/>
  <rect x="70" y="50" width="48" height="5" rx="2.5" fill="#f0ece5"/>
  <rect x="70" y="63" width="30" height="3" rx="1.5" fill="#3a3835"/>
  <rect x="70" y="69" width="140" height="12" rx="4" fill="#232220"/>
  <rect x="76" y="73.5" width="44" height="3" rx="1.5" fill="#f0ece5" fill-opacity="0.7"/>
  <rect x="70" y="87" width="30" height="3" rx="1.5" fill="#3a3835"/>
  <rect x="70" y="93" width="140" height="12" rx="4" fill="#232220" stroke="#25f07c" stroke-width="1.5"/>
  <rect x="76" y="97.5" width="92" height="3" rx="1.5" fill="#25f07c"/>
  <rect x="70" y="116" width="54" height="14" rx="5" fill="#25f07c"/>
  <rect x="80" y="121.5" width="34" height="3" rx="1.5" fill="#0b0b0a"/>

  <!-- Phone: a channel playing above the channel list -->
  <rect x="214" y="62" width="58" height="114" rx="12" fill="#ffffff" stroke="#0b0b0a" stroke-width="2"/>
  <rect x="235" y="67" width="16" height="3" rx="1.5" fill="#0b0b0a"/>
  <rect x="222" y="74" width="42" height="90" rx="5" fill="#0b0b0a"/>
  <rect x="226" y="78" width="34" height="22" rx="3" fill="#232220"/>
  <g transform="translate(243 89) scale(0.28)">
    <g transform="rotate(45)">
      <rect x="-26" y="-26" width="52" height="52" rx="12" fill="#25f07c"/>
    </g>
    <path d="M-7 -11.5c0-1.5 1.6-2.4 2.9-1.6l16.2 10.3c1.2.8 1.2 2.5 0 3.3L-4.1 10.8c-1.3.8-2.9-.1-2.9-1.6V-11.5z" fill="#0b0b0a"/>
  </g>
  <rect x="226" y="106" width="6" height="6" rx="1.5" fill="#25f07c"/>
  <rect x="235" y="107.5" width="24" height="3" rx="1.5" fill="#f0ece5"/>
  <g fill="#3a3835">
    <rect x="226" y="116" width="6" height="6" rx="1.5"/>
    <rect x="235" y="117.5" width="20" height="3" rx="1.5"/>
    <rect x="226" y="126" width="6" height="6" rx="1.5"/>
    <rect x="235" y="127.5" width="24" height="3" rx="1.5"/>
    <rect x="226" y="136" width="6" height="6" rx="1.5"/>
    <rect x="235" y="137.5" width="16" height="3" rx="1.5"/>
    <rect x="226" y="146" width="6" height="6" rx="1.5"/>
    <rect x="235" y="147.5" width="22" height="3" rx="1.5"/>
  </g>
  </g>
</svg>
