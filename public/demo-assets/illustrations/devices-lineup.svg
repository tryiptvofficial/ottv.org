<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" fill="none">
  <title>A TV, laptop, tablet and phone, each showing a TV guide</title>
  <!-- Original OTTV illustration: generic devices with no manufacturer marks. Ink #0b0b0a, green #25f07c. -->
  <defs>
    <g id="guide-rows">
      <rect x="0" y="0" width="34" height="8" rx="4" fill="#3a3835"/>
      <rect x="40" y="0" width="70" height="8" rx="4" fill="#25f07c"/>
      <rect x="116" y="0" width="44" height="8" rx="4" fill="#3a3835"/>
      <rect x="0" y="16" width="34" height="8" rx="4" fill="#3a3835"/>
      <rect x="40" y="16" width="40" height="8" rx="4" fill="#3a3835"/>
      <rect x="86" y="16" width="74" height="8" rx="4" fill="#f0ece5" fill-opacity="0.55"/>
      <rect x="0" y="32" width="34" height="8" rx="4" fill="#3a3835"/>
      <rect x="40" y="32" width="88" height="8" rx="4" fill="#3a3835"/>
      <rect x="134" y="32" width="26" height="8" rx="4" fill="#3a3835"/>
    </g>
  </defs>

  <!-- Soft floor shadow -->
  <ellipse cx="320" cy="388" rx="280" ry="14" fill="#0b0b0a" fill-opacity="0.08"/>

  <!-- TV -->
  <rect x="40" y="30" width="400" height="244" rx="16" fill="#0b0b0a"/>
  <rect x="54" y="44" width="372" height="216" rx="8" fill="#141413"/>
  <g transform="translate(140 88)">
    <g transform="rotate(45)">
      <rect x="-30" y="-30" width="60" height="60" rx="14" fill="#25f07c"/>
    </g>
    <path d="M-8 -13c0-1.7 1.9-2.8 3.4-1.9l18.6 11.9c1.4.9 1.4 2.9 0 3.8L-4.6 12.7c-1.5.9-3.4-.2-3.4-1.9V-13z" fill="#0b0b0a"/>
  </g>
  <rect x="200" y="70" width="120" height="10" rx="5" fill="#f0ece5"/>
  <rect x="200" y="88" width="180" height="8" rx="4" fill="#3a3835"/>
  <rect x="200" y="102" width="150" height="8" rx="4" fill="#3a3835"/>
  <use href="#guide-rows" transform="translate(80 160) scale(2 1.6)"/>
  <rect x="80" y="236" width="320" height="4" rx="2" fill="#3a3835"/>
  <rect x="80" y="236" width="190" height="4" rx="2" fill="#25f07c"/>
  <path d="M210 274l-14 40h88l-14-40" fill="#ffffff" stroke="#0b0b0a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="170" y="312" width="140" height="10" rx="5" fill="#0b0b0a"/>

  <!-- Laptop -->
  <rect x="378" y="192" width="214" height="136" rx="10" fill="#0b0b0a"/>
  <rect x="388" y="202" width="194" height="116" rx="5" fill="#141413"/>
  <use href="#guide-rows" transform="translate(402 222) scale(1.04 1.2)"/>
  <rect x="402" y="286" width="166" height="8" rx="4" fill="#3a3835"/>
  <rect x="402" y="286" width="72" height="8" rx="4" fill="#25f07c"/>
  <path d="M352 328h266l-14 26H366z" fill="#ffffff" stroke="#0b0b0a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="460" y="334" width="50" height="6" rx="3" fill="#e3ded5"/>

  <!-- Tablet -->
  <rect x="96" y="236" width="150" height="132" rx="14" fill="#ffffff" stroke="#0b0b0a" stroke-width="3"/>
  <rect x="108" y="248" width="126" height="108" rx="6" fill="#0b0b0a"/>
  <use href="#guide-rows" transform="translate(118 264) scale(0.66 1.1)"/>
  <rect x="118" y="322" width="106" height="20" rx="6" fill="#141413"/>
  <rect x="124" y="329" width="40" height="6" rx="3" fill="#25f07c"/>

  <!-- Phone -->
  <rect x="268" y="262" width="74" height="132" rx="14" fill="#ffffff" stroke="#0b0b0a" stroke-width="3"/>
  <rect x="278" y="276" width="54" height="100" rx="6" fill="#0b0b0a"/>
  <g transform="translate(305 304)">
    <g transform="rotate(45)">
      <rect x="-11" y="-11" width="22" height="22" rx="5" fill="#25f07c"/>
    </g>
    <path d="M-3 -4.8c0-.6.7-1 1.2-.7l6.9 4.4c.5.3.5 1.1 0 1.4l-6.9 4.4c-.5.3-1.2-.1-1.2-.7v-8.8z" fill="#0b0b0a"/>
  </g>
  <rect x="286" y="330" width="38" height="5" rx="2.5" fill="#f0ece5"/>
  <rect x="286" y="342" width="30" height="5" rx="2.5" fill="#3a3835"/>
  <rect x="286" y="354" width="34" height="5" rx="2.5" fill="#3a3835"/>
  <rect x="293" y="382" width="24" height="5" rx="2.5" fill="#0b0b0a"/>
</svg>
