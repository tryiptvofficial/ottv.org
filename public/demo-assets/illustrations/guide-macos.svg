<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 320 200" fill="none">
  <title>A laptop showing a player app's sign-in form for a username, password and server address</title>
  <!-- Original OTTV illustration for the macOS guide: a generic laptop and window, no operating-system or app marks. Ink #0b0b0a, green #25f07c. -->
  <rect width="320" height="200" fill="#ece9e2"/>
  <ellipse cx="160" cy="181" rx="113" ry="6" fill="#0b0b0a" fill-opacity="0.08"/>
  <!-- The top-left corner stays empty for the category tag that cards place there. -->
  <g transform="translate(16 25.8) scale(0.9)">
    <rect x="56" y="18" width="208" height="134" rx="10" fill="#0b0b0a"/>
    <rect x="63" y="25" width="194" height="120" rx="5" fill="#141413"/>

    <!-- The player's sign-in window -->
    <rect x="104" y="32" width="112" height="106" rx="7" fill="#f0ece5"/>
    <g fill="#8c877f">
      <circle cx="113" cy="40" r="2.2"/>
      <circle cx="120" cy="40" r="2.2"/>
      <circle cx="127" cy="40" r="2.2"/>
    </g>
    <!-- The login details, shown as a key, as in the ordering step -->
    <circle cx="160" cy="54" r="9" fill="#0b0b0a"/>
    <circle cx="156.5" cy="54" r="3" stroke="#25f07c" stroke-width="1.6"/>
    <path d="M159.5 54h7m-2.5 0v3m2.5-3v2.5" stroke="#25f07c" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Username, password and server address -->
    <g fill="#ffffff" stroke="#0b0b0a" stroke-width="1.2">
      <rect x="114" y="70" width="92" height="11" rx="3"/>
      <rect x="114" y="85" width="92" height="11" rx="3"/>
      <rect x="114" y="100" width="92" height="11" rx="3"/>
    </g>
    <rect x="119" y="74" width="40" height="3" rx="1.5" fill="#0b0b0a" fill-opacity="0.7"/>
    <g fill="#0b0b0a">
      <circle cx="120" cy="90.5" r="1.5"/>
      <circle cx="126" cy="90.5" r="1.5"/>
      <circle cx="132" cy="90.5" r="1.5"/>
      <circle cx="138" cy="90.5" r="1.5"/>
      <circle cx="144" cy="90.5" r="1.5"/>
      <circle cx="150" cy="90.5" r="1.5"/>
    </g>
    <rect x="119" y="104" width="66" height="3" rx="1.5" fill="#0b0b0a" fill-opacity="0.7"/>
    <rect x="114" y="117" width="92" height="12" rx="3" fill="#25f07c" stroke="#0b0b0a" stroke-width="1.2"/>
    <rect x="146" y="121.5" width="28" height="3" rx="1.5" fill="#0b0b0a"/>

    <!-- Laptop base -->
    <path d="M40 152h240l-10 18H50z" fill="#ffffff" stroke="#0b0b0a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="140" y="155" width="40" height="4" rx="2" fill="#e3ded5"/>
  </g>
</svg>
